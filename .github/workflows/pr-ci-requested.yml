name: Check CI opt-in

on:
  workflow_call:
    inputs:
      extra-label:
        type: string
        default: ''
    outputs:
      requested:
        value: ${{ jobs.labels.outputs.requested }}

jobs:
  labels:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      requested: ${{ steps.check.outputs.result }}
    steps:
      - id: check
        uses: actions/github-script@v8
        env:
          EXTRA_LABEL: ${{ inputs.extra-label }}
        with:
          script: |
            if (!context.payload.pull_request) return true;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });
            const labels = pr.labels.map(label => label.name);
            return labels.includes('run-ci') &&
              (!process.env.EXTRA_LABEL || labels.includes(process.env.EXTRA_LABEL));
      - name: Waiting for ${{ inputs.extra-label || 'run-ci' }}
        if: steps.check.outputs.result == 'false'
        run: echo 'Optional CI skipped. Both run-ci and any suite-specific label are required.' >> "$GITHUB_STEP_SUMMARY"
